name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # The unit tests start the real Pyodide in Node, which needs WebAssembly JSPI (Node 26, or Node 24 with a flag).
          node-version: 26
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fetch-upstream
      - run: pnpm run check
      - run: pnpm test
      # oxidevm wasm test drives the SDK's Playwright; playwright-core of the same version installs its Chromium.
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm run test:conformance
