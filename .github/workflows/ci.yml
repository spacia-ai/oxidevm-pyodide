# This workflow starts on request only. The @oxidevm packages of the CLI that generated this project are on a private registry
# that GitHub's runners cannot reach, so an automatic run would fail on every push. Give it the push (and pull_request, or tag)
# trigger of the public template once the packages install from a registry the runner can reach.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # The unit tests start the real Pyodide in Node, which needs WebAssembly JSPI (Node 26, or Node 24 with a flag).
          node-version: 26
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fetch-upstream
      - run: pnpm run check
      - run: pnpm test
