# Not green yet by design: `pnpm install` needs @oxidevm/sdk and @oxidevm/cli 0.1.0-alpha.301, which only a private
# registry on the maintainer's machine serves today (see AGENTS.md). This workflow works once those packages are published.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The unit tests start the real Pyodide in Node, which needs WebAssembly JSPI (Node 26, or Node 24 with a flag).
          node-version: 26
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fetch-upstream
      - run: pnpm run check
      - run: pnpm test
